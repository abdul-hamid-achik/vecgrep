<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vecgrep Studio</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 128 128" width="26" height="26" aria-hidden="true">
        <rect x="12" y="12" width="104" height="104" rx="24" fill="#0F172A"/>
        <path d="M34 42H78C87.9411 42 96 50.0589 96 60C96 69.9411 87.9411 78 78 78H67" stroke="#2DD4BF" stroke-width="10" stroke-linecap="round"/>
        <path d="M56 50L36 64L56 78" stroke="#60A5FA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="82" cy="86" r="8" fill="#A78BFA"/>
      </svg>
      <div class="brand-text"><strong>Vecgrep Studio</strong><span id="brand-version">…</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="side-foot-row"><span class="dot" id="bin-dot"></span><span id="bin-label">binary…</span></div>
      <div class="side-foot-row"><span class="dot" id="mcp-dot"></span><span id="mcp-label">mcp…</span></div>
    </div>
  </aside>
  <div id="main">
    <header id="topbar">
      <div class="proj-picker">
        <label for="proj-select">Project</label>
        <select id="proj-select" title="Active project"></select>
        <button id="proj-browse" class="btn ghost sm" title="Choose folder…">Browse</button>
        <button id="proj-refresh" class="btn ghost sm" title="Reload view">Reload</button>
      </div>
      <div class="top-status">
        <span id="provider-pill" class="pill">provider…</span>
        <span id="health-pill" class="pill">index…</span>
        <span id="busy" class="busy hidden" aria-live="polite"><span class="spinner"></span><span id="busy-label">working…</span></span>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="app.js"></script>
<script src="views/dashboard.js"></script>
<script src="views/search.js"></script>
<script src="views/similar.js"></script>
<script src="views/investigate.js"></script>
<script src="views/indexmgmt.js"></script>
<script src="views/structure.js"></script>
<script src="views/projects.js"></script>
<script src="views/branches.js"></script>
<script src="views/ops.js"></script>
<script src="views/memory.js"></script>
<script src="views/config.js"></script>
<script src="views/doctor.js"></script>
<script src="views/benchmark.js"></script>
<script src="views/mcp.js"></script>
</body>
</html>
